[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agency"
version = "0.1.0"
description = "Autonomous multi-agent website agency: LangGraph state machine, human approval gates, learning optimizer loop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "pydantic[email]>=2.14,<3",
    "fastapi>=0.147,<1",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
agency = "main:main"

[tool.setuptools]
packages = ["agency"]
py-modules = ["main", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
